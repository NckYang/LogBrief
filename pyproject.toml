[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logbrief"
version = "0.1.0"
description = "Key-free evidence-preserving log compression for CLI and MCP agents"
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.12,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
logbrief = "logbrief.cli:main"
logbrief-mcp = "logbrief.mcp_server:main"

[tool.setuptools.packages.find]
include = ["logbrief*"]
